[project]
name = "dsssl-expr-public"
version = "0.1.0"
description = "NTK-based Data Shapley pseudo-labeling for semi-supervised learning — demo code for JSAI 2026"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jax==0.4.34",
    "jaxlib==0.4.34",
    "neural-tangents==0.6.5",
    "gradio==6.14.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ntk_ds"]
